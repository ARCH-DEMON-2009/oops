<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Oops! Something Went Wrong</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #f8fafc, #eef2ff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #111827;
    }

    .error-container {
      width: 100%;
      max-width: 520px;
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: 45px 30px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.10);
      backdrop-filter: blur(15px);
    }

    .illustration {
      width: 210px;
      height: 210px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .illustration img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .error-code {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #6366f1;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(30px, 7vw, 44px);
      line-height: 1.15;
      margin-bottom: 14px;
      font-weight: 800;
    }

    .description {
      max-width: 400px;
      margin: 0 auto 28px;
      color: #64748b;
      font-size: 16px;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button,
    .home-btn {
      border: none;
      text-decoration: none;
      cursor: pointer;
      padding: 13px 24px;
      border-radius: 13px;
      font-size: 15px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .retry-btn {
      color: white;
      background: #6366f1;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
    }

    .retry-btn:hover {
      transform: translateY(-2px);
      background: #4f46e5;
    }

    .home-btn {
      color: #334155;
      background: #f1f5f9;
    }

    .home-btn:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 28px;
      color: #94a3b8;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .error-container {
        padding: 35px 20px;
        border-radius: 22px;
      }

      .illustration {
        width: 180px;
        height: 180px;
      }

      .description {
        font-size: 15px;
      }

      .buttons {
        flex-direction: column;
      }

      button,
      .home-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="error-container">

    <!-- Error Illustration -->
    <div class="illustration">
      <img
        src="https://cdn-icons-png.flaticon.com/512/6134/6134065.png"
        alt="Something went wrong"
      />
    </div>

    <div class="error-code">Error 500</div>

    <h1>Oops! Something went wrong.</h1>

    <p class="description">
      Something unexpected happened while loading this page.
      Please try again. If the problem continues, come back later.
    </p>

    <div class="buttons">
      <button class="retry-btn" onclick="location.reload()">
        ↻ Try Again
      </button>

      <a href="/" class="home-btn">
        ← Go Home
      </a>
    </div>

    <div class="footer">
      We’re working to get things back to normal.
    </div>

  </main>

</body>
</html>
